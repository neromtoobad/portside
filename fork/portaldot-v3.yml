# Local fork of the Portaldot V3 testnet for development. Real runtime, fake balances.
endpoint: ws://127.0.0.1:9944  # ws-relay.mjs -> https://test-node-v3.portaldot.dev
port: 8000
# Pinned so the local storage cache (.chopsticks/db.sqlite) stays valid across restarts.
block: 265063
rpc-timeout: 300000
mock-signature-host: true
